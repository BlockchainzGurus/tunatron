[package]
name = "sast-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
futures = "0.3.34"
hex = "0.4.3"
petgraph = "0.8.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sha3 = "0.12.0"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "time", "fs", "net", "sync", "signal"] }
toml = "1.2.0"
tree-sitter = "0.27.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-python = "0.25.0"
uuid = { version = "1.29.0", features = ["v4"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

# Profili leggeri: meno RAM/disco in compilazione sulla macchina di sviluppo.
[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.release]
lto = "thin"
codegen-units = 4
